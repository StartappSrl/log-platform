worker_processes auto;

events { worker_connections 1024; }

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    client_max_body_size 20m;

    upstream auth_upstream    { server auth-service:8000; }

    server {
        listen 80;
        server_name _;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        server_name _;

        ssl_certificate     /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;

        # Pagina di login e chiamate API di autenticazione: sempre libere
        location = /login.html {
            root /usr/share/nginx/html;
        }

        location /_authgate/ {
            proxy_pass http://auth_upstream/_authgate/;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header Host $host;
        }

        # Endpoint interno usato SOLO da auth_request (non raggiungibile da fuori
        # perché nginx lo richiama internamente).
        location = /auth-check-internal {
            internal;
            proxy_pass http://auth_upstream/_authgate/auth_check;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header X-Real-IP $remote_addr;
        }

        location = / {
            return 302 /dashboard.html;
        }

        # Tutto il resto (il PANNELLO, non più Graylog direttamente) richiede
        # sessione valida. Graylog resta raggiungibile solo lato server, da
        # auth-service (vedi GRAYLOG_URL), mai esposto direttamente all'utente.
        location / {
            auth_request /auth-check-internal;
            error_page 401 = @login_redirect;

            auth_request_set $auth_user $upstream_http_x_auth_user;
            proxy_set_header X-Auth-User $auth_user;

            proxy_pass http://auth_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location @login_redirect {
            return 302 /login.html;
        }
    }
}
