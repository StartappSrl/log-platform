version: "3.8"

networks:
  backend:
    driver: bridge
  frontend:
    driver: bridge

volumes:
  mongo_data:
  opensearch_data:
  graylog_data:
  graylog_journal:
  mariadb_data:

services:

  mongodb:
    image: mongo:6.0
    restart: unless-stopped
    networks: [backend]
    volumes:
      - mongo_data:/data/db

  opensearch:
    image: opensearchproject/opensearch:2.15.0
    restart: unless-stopped
    environment:
      - "OPENSEARCH_JAVA_OPTS=${OPENSEARCH_JAVA_OPTS:--Xms1g -Xmx1g}"
      - discovery.type=single-node
      - plugins.security.disabled=true
      - bootstrap.memory_lock=true
    ulimits:
      memlock: { soft: -1, hard: -1 }
    networks: [backend]
    volumes:
      - opensearch_data:/usr/share/opensearch/data

  graylog:
    image: graylog/graylog:6.1
    restart: unless-stopped
    depends_on: [mongodb, opensearch]
    environment:
      - GRAYLOG_PASSWORD_SECRET=${GRAYLOG_PASSWORD_SECRET}
      - GRAYLOG_ROOT_PASSWORD_SHA2=${GRAYLOG_ROOT_PASSWORD_SHA2}
      - GRAYLOG_HTTP_EXTERNAL_URI=${GRAYLOG_HTTP_EXTERNAL_URI}
      - GRAYLOG_MONGODB_URI=mongodb://mongodb:27017/graylog
      - GRAYLOG_ELASTICSEARCH_HOSTS=http://opensearch:9200
      # SMTP per le notifiche email create dal pannello (facoltativo: lascia
      # vuoto GRAYLOG_TRANSPORT_EMAIL_HOSTNAME se non ti serve l'invio email)
      - GRAYLOG_TRANSPORT_EMAIL_ENABLED=${GRAYLOG_SMTP_ENABLED:-false}
      - GRAYLOG_TRANSPORT_EMAIL_HOSTNAME=${GRAYLOG_SMTP_HOST:-}
      - GRAYLOG_TRANSPORT_EMAIL_PORT=${GRAYLOG_SMTP_PORT:-587}
      - GRAYLOG_TRANSPORT_EMAIL_USE_AUTH=${GRAYLOG_SMTP_USE_AUTH:-true}
      - GRAYLOG_TRANSPORT_EMAIL_AUTH_USERNAME=${GRAYLOG_SMTP_USER:-}
      - GRAYLOG_TRANSPORT_EMAIL_AUTH_PASSWORD=${GRAYLOG_SMTP_PASSWORD:-}
      - GRAYLOG_TRANSPORT_EMAIL_USE_TLS=${GRAYLOG_SMTP_USE_TLS:-true}
      - GRAYLOG_TRANSPORT_EMAIL_FROM_EMAIL=${GRAYLOG_ALERT_EMAIL_FROM:-alerts@logplatform.local}
    networks: [backend]
    volumes:
      - graylog_data:/usr/share/graylog/data
      - graylog_journal:/usr/share/graylog/data/journal
      - ./ca:/etc/graylog/certs:ro   # certificato server per l'input GELF TLS (mTLS)
    ports:
      # Input GELF TCP+TLS per gli agent client — SOLO su interfaccia interna/VPN,
      # mai esposto direttamente su Internet senza filtro. Vedi manuale.
      - "127.0.0.1:12201:12201"
      - "12201:12201"   # rimuovi/filtra con firewall se non ti serve da remoto diretto

  mariadb:
    image: mariadb:11
    restart: unless-stopped
    environment:
      - MARIADB_ROOT_PASSWORD=${MARIADB_ROOT_PASSWORD}
      - MARIADB_DATABASE=${MARIADB_DATABASE}
      - MARIADB_USER=${MARIADB_USER}
      - MARIADB_PASSWORD=${MARIADB_PASSWORD}
    networks: [backend]
    volumes:
      - mariadb_data:/var/lib/mysql

  auth-service:
    build: ./auth-service
    restart: unless-stopped
    depends_on: [mariadb, graylog]
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - AUTH_SECRET_KEY=${AUTH_SECRET_KEY}
      - SESSION_COOKIE_NAME=${SESSION_COOKIE_NAME}
      - SESSION_LIFETIME_MINUTES=${SESSION_LIFETIME_MINUTES}
      - PUBLIC_DOMAIN=${PUBLIC_DOMAIN}
      - GRAYLOG_URL=http://graylog:9000
      - GRAYLOG_API_USER=${GRAYLOG_API_USER}
      - GRAYLOG_API_PASSWORD=${GRAYLOG_API_PASSWORD}
    networks: [backend, frontend]

  ai-service:
    build: ./ai-service
    restart: unless-stopped
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - AI_SERVICE_MODEL=${AI_SERVICE_MODEL}
      - AI_SERVICE_WEBHOOK_TOKEN=${AI_SERVICE_WEBHOOK_TOKEN}
    networks: [backend, frontend]
    volumes:
      - ./ai-service/tenant_webhooks.json:/app/tenant_webhooks.json:ro

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on: [graylog, auth-service]
    networks: [frontend]
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      - ./auth-service/static:/usr/share/nginx/html:ro
