name: Test di non-regressione

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Imposta Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installa le dipendenze
        run: |
          pip install pytest --break-system-packages
          pip install -r auth-service/requirements.txt --break-system-packages

      - name: Esegui i test
        env:
          GRAYLOG_API_USER: test
          GRAYLOG_API_PASSWORD: test
          GRAYLOG_URL: http://127.0.0.1:0
        run: python3 -m pytest tests/ -v

      - name: Controlli di integrazione (mail, backup, flusso dei log)
        run: |
          pip install flask flask_sqlalchemy requests matplotlib --break-system-packages
          for f in tests/integration/check_*.py; do
            echo "=== $f ==="
            python3 "$f" || exit 1
          done
