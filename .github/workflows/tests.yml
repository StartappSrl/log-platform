name: Test di non-regressione

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Imposta Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installa pytest
        run: pip install pytest --break-system-packages

      - name: Esegui i test
        run: python3 -m pytest tests/ -v
