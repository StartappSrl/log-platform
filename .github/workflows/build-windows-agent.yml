name: Build agent Windows (.exe)

# Costruisce un eseguibile Windows standalone dell'agent, cosi' i client
# Windows non devono installare Python/pywin32 a mano - basta scaricare
# l'exe (unico, uguale per tutti i tenant) + agent.ini/certificati
# specifici del cliente (quelli scaricati dal pannello).
on:
  push:
    tags:
      - "v*.*.*"
  # Sulle PR che toccano l'agent (e a mano): build e prova dell'installatore,
  # con versione 0.0.0 e SENZA pubblicare nessun rilascio.
  pull_request:
    paths:
      - "agent/**"
      - "scripts/rilascio_agent.py"
      - ".github/workflows/build-windows-agent.yml"
  workflow_dispatch:

jobs:
  build-windows-exe:
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      VERSIONE: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '0.0.0' }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installa le dipendenze
        run: |
          pip install pywin32 pyinstaller cryptography==50.0.2

      - name: Scrivi il numero di versione nell'agent
        run: python scripts/rilascio_agent.py versione "$env:VERSIONE"

      - name: Build eseguibile
        working-directory: agent
        shell: pwsh
        run: |
          # pywintypes*.dll e pythoncom*.dll sono caricate dinamicamente da
          # pywin32 (non tramite import normale), quindi PyInstaller non le
          # rileva da solo - vanno aggiunte esplicitamente, altrimenti il
          # servizio installa ma non parte mai (errore 1053), pur
          # funzionando in modalita' debug. Scoperto testando dal vivo
          # un'installazione reale.
          $pywin32Dir = python -c "import win32api, os; print(os.path.join(os.path.dirname(os.path.dirname(win32api.__file__)), 'pywin32_system32'))"
          Write-Host "Cerco le DLL pywin32 in: $pywin32Dir"
          if (!(Test-Path $pywin32Dir)) {
            Write-Error "Cartella pywin32_system32 non trovata in: $pywin32Dir"
            exit 1
          }
          Get-ChildItem $pywin32Dir -Filter "*.dll"

          $addBinaryArgs = @()
          foreach ($dll in Get-ChildItem $pywin32Dir -Filter "*.dll") {
            $addBinaryArgs += "--add-binary"
            $addBinaryArgs += "$($dll.FullName);."
          }

          pyinstaller --onedir --name logplatform-agent `
            --hidden-import win32timezone `
            --hidden-import win32serviceutil `
            --hidden-import win32service `
            --hidden-import win32event `
            --hidden-import servicemanager `
            @addBinaryArgs `
            agent_windows.py

      - name: Build installer grafico
        working-directory: agent
        shell: pwsh
        run: |
          pyinstaller --onefile --windowed --uac-admin --name installer_gui installer_gui.py
          if (!(Test-Path "dist\installer_gui.exe")) {
            Write-Error "Build installer grafico fallita: dist\installer_gui.exe non trovato"
            exit 1
          }
          # Lo metto DENTRO la stessa cartella che verra' compressa, cosi'
          # finisce nello zip di release senza toccare agent_packager.py
          Copy-Item "dist\installer_gui.exe" "dist\logplatform-agent\installer_gui.exe"

      - name: Verifica e comprimi la cartella risultante
        working-directory: agent
        run: |
          if (!(Test-Path "dist\logplatform-agent\logplatform-agent.exe")) {
            Write-Error "Build fallita: dist\logplatform-agent\logplatform-agent.exe non trovato"
            exit 1
          }
          if (!(Test-Path "dist\logplatform-agent\installer_gui.exe")) {
            Write-Error "Build fallita: dist\logplatform-agent\installer_gui.exe non trovato"
            exit 1
          }
          Write-Host "Cartella creata, contenuto:"
          Get-ChildItem "dist\logplatform-agent" | Select-Object Name, Length
          Compress-Archive -Path "dist\logplatform-agent\*" -DestinationPath "dist\logplatform-agent-windows.zip"

      - name: Installatore unico (logplatform-agent-setup.exe)
        working-directory: agent
        run: |
          # L'installatore contiene l'agent intero; il portale ci attacca in coda
          # la configurazione e i certificati del cliente (vedi installer_logic.py).
          Copy-Item "dist\logplatform-agent-windows.zip" "dist\agent_payload.zip"
          pyinstaller --onefile --windowed --uac-admin --name logplatform-agent-setup `
            --add-data "dist\agent_payload.zip;." installer_gui.py
          if (!(Test-Path "dist\logplatform-agent-setup.exe")) {
            Write-Error "Build installatore unico fallita"
            exit 1
          }

      - name: Prova l'installatore unico con una configurazione in coda
        working-directory: agent
        run: |
          python -c "import installer_logic as il; open('dist/setup-prova.exe','wb').write(open('dist/logplatform-agent-setup.exe','rb').read() + il.build_tenant_payload({'agent.ini': '[agent]\ntenant = prova\n', 'ca.pem': b'CA', 'prova.pem': b'C', 'prova-key.pem': b'K'}))"
          foreach ($caso in @(@{exe='dist\logplatform-agent-setup.exe'; attesi=''}, @{exe='dist\setup-prova.exe'; attesi='agent.ini,ca.pem,prova-key.pem,prova.pem'})) {
            $out = Join-Path $PWD "verifica.json"
            Remove-Item $out -ErrorAction SilentlyContinue
            Start-Process -FilePath $caso.exe -ArgumentList "--verifica", "`"$out`"" -Wait
            $r = Get-Content $out -Raw | ConvertFrom-Json
            Write-Host "$($caso.exe): $(Get-Content $out -Raw)"
            if (-not $r.ok -or -not $r.agent_zip -or -not $r.has_agent_exe -or (($r.config_files -join ',') -ne $caso.attesi)) {
              Write-Error "L'installatore non legge correttamente agent o configurazione ($($caso.exe))"
              exit 1
            }
          }

      - name: Pacchetto Linux e firma dei pacchetti (aggiornamento automatico)
        env:
          AGENT_SIGNING_KEY: ${{ secrets.AGENT_SIGNING_KEY }}
        run: |
          python scripts/rilascio_agent.py linux "$env:VERSIONE" agent/dist/logplatform-agent-linux.tar.gz
          if ($LASTEXITCODE -ne 0) { exit 1 }
          python scripts/rilascio_agent.py firma agent/dist/logplatform-agent-windows.zip windows "$env:VERSIONE"
          if ($LASTEXITCODE -ne 0) { exit 1 }
          python scripts/rilascio_agent.py firma agent/dist/logplatform-agent-linux.tar.gz linux "$env:VERSIONE"
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Carica come artefatto della build
        uses: actions/upload-artifact@v4
        with:
          name: logplatform-agent-windows-${{ env.VERSIONE }}
          path: |
            agent/dist/logplatform-agent-windows.zip
            agent/dist/logplatform-agent-setup.exe
          retention-days: 90

      - name: Pubblica come Release (per il download dal pannello)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            agent/dist/logplatform-agent-windows.zip
            agent/dist/logplatform-agent-setup.exe
            agent/dist/logplatform-agent-windows.zip.manifest.json
            agent/dist/logplatform-agent-windows.zip.sig
            agent/dist/logplatform-agent-linux.tar.gz
            agent/dist/logplatform-agent-linux.tar.gz.manifest.json
            agent/dist/logplatform-agent-linux.tar.gz.sig
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
