name: Build agent Windows (.exe)

# Costruisce un eseguibile Windows standalone dell'agent, cosi' i client
# Windows non devono installare Python/pywin32 a mano - basta scaricare
# l'exe (unico, uguale per tutti i tenant) + agent.ini/certificati
# specifici del cliente (quelli scaricati dal pannello).
on:
  push:
    tags:
      - "v*.*.*"

jobs:
  build-windows-exe:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installa le dipendenze
        run: |
          pip install pywin32 pyinstaller

      - name: Build eseguibile
        working-directory: agent
        shell: pwsh
        run: |
          # pywintypes*.dll e pythoncom*.dll sono caricate dinamicamente da
          # pywin32 (non tramite import normale), quindi PyInstaller non le
          # rileva da solo - vanno aggiunte esplicitamente, altrimenti il
          # servizio installa ma non parte mai (errore 1053), pur
          # funzionando in modalita' debug. Scoperto testando dal vivo
          # un'installazione reale.
          $pySite = python -c "import site; print(site.getsitepackages()[0])"
          $pywin32Dir = Join-Path $pySite "pywin32_system32"
          Write-Host "Cerco le DLL pywin32 in: $pywin32Dir"
          Get-ChildItem $pywin32Dir -Filter "*.dll"

          $addBinaryArgs = @()
          foreach ($dll in Get-ChildItem $pywin32Dir -Filter "*.dll") {
            $addBinaryArgs += "--add-binary"
            $addBinaryArgs += "$($dll.FullName);."
          }

          pyinstaller --onedir --name logplatform-agent `
            --hidden-import win32timezone `
            --hidden-import win32serviceutil `
            --hidden-import win32service `
            --hidden-import win32event `
            --hidden-import servicemanager `
            @addBinaryArgs `
            agent_windows.py

      - name: Verifica e comprimi la cartella risultante
        working-directory: agent
        run: |
          if (!(Test-Path "dist\logplatform-agent\logplatform-agent.exe")) {
            Write-Error "Build fallita: dist\logplatform-agent\logplatform-agent.exe non trovato"
            exit 1
          }
          Write-Host "Cartella creata, contenuto:"
          Get-ChildItem "dist\logplatform-agent" | Select-Object Name, Length
          Compress-Archive -Path "dist\logplatform-agent\*" -DestinationPath "dist\logplatform-agent-windows.zip"

      - name: Carica come artefatto della build
        uses: actions/upload-artifact@v4
        with:
          name: logplatform-agent-windows-${{ github.ref_name }}
          path: agent/dist/logplatform-agent-windows.zip
          retention-days: 90

      - name: Pubblica come Release (per il download dal pannello)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: agent/dist/logplatform-agent-windows.zip
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
